name: schamchat_mobile
description: "Sosyal Canlı Yayın ve Eğlence Platformu - SchamChat"
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  dio: ^5.4.0

  # State Management
  provider: ^6.1.0
  get_it: ^7.6.0

  # UI
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  lottie: ^2.7.0

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.19.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3

  # WebRTC
  flutter_webrtc: ^0.11.7

  # Camera & Permissions
  camera: ^0.10.5
  permission_handler: ^11.0.0

  # Utils
  logger: ^2.0.0
  connectivity_plus: ^5.0.2
  intl_phone_number_input: ^0.7.4

  # Animation
  animations: ^2.0.11

  # Payment (Opsiyonel)
  pay: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/rooms/
    - assets/images/games/
    - assets/animations/
    - assets/icons/
    - assets/translations/
